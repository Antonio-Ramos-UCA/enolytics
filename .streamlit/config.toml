[theme]
# Identidad del Marco de Jerez en el CROMO de la interfaz.
# Los colores de los DATOS no se tocan aquí: van en enolytics/dashboard/estilo.py,
# tomados de una paleta ya validada (contraste y seguridad para daltonismo).
# Actualizado el 25/11/2026 a la capa «panel» (ver estilo.css_panel): lienzo gris, tarjeta
# blanca y azul de acero como acento. La escala del vino sigue viva en estilo.py y en los
# documentos en PDF; aquí manda la legibilidad del cuadro de mando.
base = "light"
primaryColor = "#4A7EBB"          # azul de acero — acento de la interfaz
backgroundColor = "#EDF0F3"       # lienzo
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2C333A"
font = "sans serif"

[server]
headless = true
